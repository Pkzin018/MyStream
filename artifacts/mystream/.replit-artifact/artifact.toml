kind = "web"
previewPath = "/"
title = "MyStream Premium"
version = "1.0.0"
id = "artifacts/mystream"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23319

[services.development]
run = "pnpm --filter @workspace/mystream run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mystream", "run", "build" ]
publicDir = "artifacts/mystream/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23319"
BASE_PATH = "/"
